<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" id="metaThemeColor" content="#09090B">
    <script>
        (function() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const paramTheme = urlParams.get('theme') || urlParams.get('modo');
                if (paramTheme === 'light' || paramTheme === 'claro') {
                    localStorage.setItem('vm_theme', 'light');
                } else if (paramTheme === 'dark' || paramTheme === 'oscuro') {
                    localStorage.setItem('vm_theme', 'dark');
                }
                const savedTheme = localStorage.getItem('vm_theme');
                const isLight = savedTheme === 'light';
                if (isLight) {
                    document.documentElement.classList.add('theme-light');
                } else {
                    document.documentElement.classList.remove('theme-light');
                }
                const metaTheme = document.getElementById('metaThemeColor') || document.querySelector('meta[name="theme-color"]');
                if (metaTheme) {
                    metaTheme.setAttribute('content', isLight ? '#F8FAFC' : '#09090B');
                }
            } catch (e) {}
        })();
    </script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" id="metaAppleStatus" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json?v=4">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').catch(function() {});
            });
        }
    </script>
    <title>Tarjetas de Agradecimiento QR Imprimibles — VirMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        /* 1. Edición Dark Streetwear (Imprenta Profesional) */
        :root {
            --bg-card: #09090B;
            --fg-card: #FFFFFF;
            --muted-card: #D4D4D8;
            --accent-card: #A3E635;
            --accent-text: #09090B;
            --border-card: #27272A;
            --badge-bg: rgba(163, 230, 53, 0.14);
        }

        /* 2. Edición Eco Color (Fondo Blanco + Verde Lima para Impresora Color de Casa) */
        body.theme-eco {
            --bg-card: #FFFFFF;
            --fg-card: #09090B;
            --muted-card: #3F3F46;
            --accent-card: #09090B;
            --accent-text: #A3E635;
            --border-card: #D4D4D8;
            --badge-bg: #F4F4F5;
        }

        /* 3. Edición Eco Blanco y Negro (100% Monocromo / Escala de Grises para Impresora B&N de Casa) */
        body.theme-bw {
            --bg-card: #FFFFFF;
            --fg-card: #09090B;
            --muted-card: #52525B;
            --accent-card: #09090B;
            --accent-text: #FFFFFF;
            --border-card: #D4D4D8;
            --badge-bg: #F4F4F5;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: #18181B;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            color: #F4F4F5;
        }

        /* Modo Claro para entorno de pantalla */
        html.theme-light body {
            background: #F1F5F9 !important;
            color: #0F172A !important;
        }
        html.theme-light .toolbar {
            background: #FFFFFF !important;
            border-bottom: 1px solid #E2E8F0 !important;
        }
        html.theme-light .toolbar strong {
            color: #0F172A !important;
        }
        html.theme-light .btn:not(.active):not(.btn-print) {
            background: #F8FAFC !important;
            border-color: #CBD5E1 !important;
            color: #0F172A !important;
        }

        /* Barra de controles en pantalla (oculta al imprimir) */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #09090B;
            border-bottom: 1px solid #27272A;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #3F3F46;
            background: #18181B;
            color: #E4E4E7;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn.active {
            background: #A3E635;
            color: #09090B;
            border-color: #A3E635;
        }

        .btn-print {
            background: #A3E635;
            color: #09090B;
            border-color: #A3E635;
            padding: 9px 18px;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Lienzo Folio A4 */
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            margin: 24px auto;
            background: #FFFFFF;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: grid;
            align-content: center;
            justify-content: center;
        }

        /* Formato 1: Postal A6 (4 por folio A4 -> 98x140mm con margen seguro de impresora) */
        .a4-sheet.layout-a6 {
            grid-template-columns: repeat(2, 98mm);
            grid-template-rows: repeat(2, 140mm);
            gap: 2mm;
            padding: 6mm;
        }

        /* Formato 2: Tarjeta de Visita (8 por folio A4 -> 85x55mm) */
        .a4-sheet.layout-business {
            grid-template-columns: repeat(2, 85mm);
            grid-template-rows: repeat(4, 55mm);
            gap: 4mm;
            padding: 20mm 15mm;
        }

        /* Diseño de cada tarjeta */
        .vip-card {
            background: var(--bg-card);
            color: var(--fg-card);
            border: 1px dashed var(--border-card);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* Estilos internos para A6 */
        .layout-a6 .vip-card {
            padding: 8mm 7mm;
            border-radius: 3mm;
            text-align: center;
        }

        .layout-a6 .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px dashed var(--border-card);
            padding-bottom: 3mm;
        }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .layout-a6 .brand-logo {
            font-size: 16pt;
        }

        .brand-accent {
            color: #65A30D;
        }

        body:not(.theme-eco):not(.theme-bw) .brand-accent {
            color: #A3E635;
        }

        body.theme-bw .brand-accent {
            color: #52525B;
        }

        .drop-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 7pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 1.2mm 2.5mm;
            border-radius: 99px;
            background: var(--badge-bg);
            border: 1px solid var(--border-card);
        }

        .layout-a6 .thanks-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15pt;
            line-height: 1.15;
            text-transform: uppercase;
            margin: 3.5mm 0 2mm;
        }

        .layout-a6 .offer-highlight {
            display: inline-block;
            background: var(--accent-card);
            color: var(--accent-text);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 11pt;
            padding: 1.5mm 3.5mm;
            border-radius: 2mm;
            text-transform: uppercase;
            margin-bottom: 2.5mm;
        }

        .layout-a6 .desc-text {
            font-size: 8.5pt;
            line-height: 1.45;
            color: var(--muted-card);
            margin: 0 auto 3.5mm;
        }

        .qr-box {
            background: #FFFFFF;
            padding: 2.2mm;
            border-radius: 2.5mm;
            border: 1.5px solid #09090B;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .layout-a6 .qr-svg {
            width: 34mm;
            height: 34mm;
            display: block;
        }

        .layout-a6 .footer-note {
            font-family: 'JetBrains Mono', monospace;
            font-size: 6.8pt;
            color: var(--muted-card);
            margin-top: 3mm;
            padding-top: 2.5mm;
            border-top: 1px dashed var(--border-card);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Estilos internos para Tarjeta de Visita (85x55mm horizontal) */
        .layout-business .vip-card {
            flex-direction: row;
            align-items: center;
            padding: 4.5mm 5mm;
            border-radius: 2mm;
            gap: 4mm;
            text-align: left;
        }

        .layout-business .card-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .layout-business .brand-row {
            display: flex;
            align-items: center;
            gap: 2mm;
            margin-bottom: 1.5mm;
        }

        .layout-business .brand-logo {
            font-size: 11pt;
        }

        .layout-business .drop-pill {
            font-size: 5.5pt;
            padding: 0.7mm 1.8mm;
        }

        .layout-business .thanks-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 9.2pt;
            line-height: 1.15;
            text-transform: uppercase;
            margin: 0 0 1.2mm;
        }

        .layout-business .offer-highlight {
            display: inline-block;
            align-self: flex-start;
            background: var(--accent-card);
            color: var(--accent-text);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 7.5pt;
            padding: 0.8mm 2mm;
            border-radius: 1.2mm;
            text-transform: uppercase;
            margin-bottom: 1.2mm;
        }

        .layout-business .desc-text {
            font-size: 6.5pt;
            line-height: 1.35;
            color: var(--muted-card);
            margin: 0;
        }

        .layout-business .qr-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .layout-business .qr-svg {
            width: 24mm;
            height: 24mm;
            display: block;
        }

        .layout-business .footer-note {
            font-family: 'JetBrains Mono', monospace;
            font-size: 5pt;
            color: var(--muted-card);
            margin-top: 1.2mm;
            text-align: center;
            text-transform: uppercase;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Envoltorio responsivo para visualización en pantalla sin desbordamiento */
        .sheet-viewport-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            padding: 24px 12px;
        }

        .sheet-scale-stage {
            transform-origin: top center;
            transition: transform 0.2s ease;
        }

        @media screen and (max-width: 640px) {
            .toolbar {
                padding: 10px 12px;
                gap: 8px;
            }
            .toolbar-group {
                width: 100%;
                justify-content: stretch;
            }
            .toolbar-group .btn {
                flex: 1 1 auto;
                text-align: center;
                font-size: 11px;
                padding: 7px 8px;
            }
            .btn-print {
                width: 100%;
            }
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            body {
                background: #FFFFFF !important;
            }
            .toolbar {
                display: none !important;
            }
            .sheet-viewport-wrapper {
                padding: 0 !important;
                display: block !important;
                overflow: visible !important;
                height: auto !important;
            }
            .sheet-scale-stage {
                transform: none !important;
                width: auto !important;
                height: auto !important;
            }
            .a4-sheet {
                margin: 0 !important;
                box-shadow: none !important;
                width: 210mm !important;
                height: 297mm !important;
            }
        }
    </style>
</head>

    <script>
        const sheet = document.getElementById('sheet');
        const tpl = document.getElementById('cardTemplate');

        function renderCards(count) {
            sheet.innerHTML = '';
            for (let i = 0; i < count; i++) {
                sheet.appendChild(tpl.content.cloneNode(true));
            }
        }

        function setLayout(mode) {
            document.getElementById('btnA6').classList.toggle('active', mode === 'a6');
            document.getElementById('btnBiz').classList.toggle('active', mode === 'business');
            if (mode === 'a6') {
                sheet.className = 'a4-sheet layout-a6';
                renderCards(4);
            } else {
                sheet.className = 'a4-sheet layout-business';
                renderCards(8);
            }
        }

        function setTheme(theme) {
            document.body.classList.remove('theme-eco', 'theme-bw');
            if (theme === 'eco') document.body.classList.add('theme-eco');
            if (theme === 'bw') document.body.classList.add('theme-bw');

            document.getElementById('btnDark').classList.toggle('active', theme === 'dark');
            document.getElementById('btnEco').classList.toggle('active', theme === 'eco');
            document.getElementById('btnBw').classList.toggle('active', theme === 'bw');
        }

        function adjustSheetScale() {
            const sheet = document.getElementById('sheet');
            const stage = document.getElementById('sheetStage');
            const wrapper = document.getElementById('sheetWrapper');
            if (!sheet || !stage || !wrapper) return;

            // Ancho físico A4: 210mm ≈ 794px a 96dpi
            const sheetPxWidth = 794;
            const sheetPxHeight = 1123;
            const availableWidth = window.innerWidth - 24;

            if (availableWidth < sheetPxWidth) {
                const scale = Math.max(0.35, Math.min(1, availableWidth / sheetPxWidth));
                stage.style.transform = `scale(${scale})`;
                wrapper.style.height = `${Math.ceil(sheetPxHeight * scale + 48)}px`;
            } else {
                stage.style.transform = 'none';
                wrapper.style.height = 'auto';
            }
        }

        window.addEventListener('resize', adjustSheetScale);
        window.addEventListener('orientationchange', adjustSheetScale);

        function updateScreenThemeUI(isLight) {
            const btn = document.getElementById('screenThemeBtn');
            const metaTheme = document.getElementById('metaThemeColor') || document.querySelector('meta[name="theme-color"]');
            const metaStatus = document.getElementById('metaAppleStatus') || document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            const moonSvg = '<svg style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
            const sunSvg = '<svg style="width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';

            if (isLight) {
                document.documentElement.classList.add('theme-light');
                if (metaTheme) metaTheme.setAttribute('content', '#F8FAFC');
                if (metaStatus) metaStatus.setAttribute('content', 'default');
                if (btn) btn.innerHTML = `${moonSvg}Modo Oscuro`;
            } else {
                document.documentElement.classList.remove('theme-light');
                if (metaTheme) metaTheme.setAttribute('content', '#09090B');
                if (metaStatus) metaStatus.setAttribute('content', 'black-translucent');
                if (btn) btn.innerHTML = `${sunSvg}Modo Claro`;
            }
        }

        function toggleScreenTheme() {
            const isNowLight = !document.documentElement.classList.contains('theme-light');
            try {
                localStorage.setItem('vm_theme', isNowLight ? 'light' : 'dark');
            } catch (e) {}
            updateScreenThemeUI(isNowLight);
        }

        updateScreenThemeUI(document.documentElement.classList.contains('theme-light'));
        renderCards(4);
        setTimeout(adjustSheetScale, 50);
    </script>
</body>
</html>
