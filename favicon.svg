<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#a3e635" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="#27272a" stroke-width="3"/>
  
  <!-- Monograma Estilizado VM Streetwear -->
  <g filter="url(#glow)">
    <!-- Letra V -->
    <path d="M 116 148 L 196 148 L 256 312 L 316 148 L 396 148 L 284 394 L 228 394 Z" fill="url(#limeGrad)"/>
    <!-- Letra M Entrelazada (Blancos de Contraste) -->
    <path d="M 188 190 L 228 190 L 256 264 L 284 190 L 324 190 L 256 348 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="148" r="16" fill="#a3e635"/>
  </g>
  <!-- Detalle Micro Tech -->
  <text x="256" y="448" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#71717a" letter-spacing="6">VIRMARKET</text>
</svg>
